# Canary : génère chaque semaine un projet neuf avec TOUS les modules sur les dernières versions
# (create-next-app@latest, outils @latest), puis lance la chaîne complète. Si un standard de
# l'écosystème bouge (majeure, option dépréciée, défaut de CLI qui change…), on le sait avant de
# scaffolder un vrai projet. Un second job synchronise un projet généré avec la version précédente
# du kit (montée de version). Tourne aussi sur chaque PR du kit. Un échec planifié est relancé une
# fois, puis signalé par une issue : voir canary-retry.yml.
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  canary:
    runs-on: ubuntu-latest
    # Un run vert prend 2 minutes : sans délai maximum, une étape bloquée (miroirs apt de
    # `playwright install --with-deps`) tourne 360 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Syntaxe des scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Scaffold (tous les modules)
        run: |
          git config --global user.name "claude-kit canary"
          git config --global user.email "canary@users.noreply.github.com"
          git config --global init.defaultBranch main
          node scripts/apply.mjs create "$RUNNER_TEMP/canary" --modules all \
            --var owner=TwelveLab12 --var boardNumber=1

      - name: "@types/node à la majeure de Node (.nvmrc)"
        working-directory: ${{ runner.temp }}/canary
        run: |
          node_major=$(grep -oE '[0-9]+' .nvmrc | head -1)
          types_major=$(node -p "require('./package.json').devDependencies['@types/node'].match(/\\d+/)[0]")
          echo "Node $node_major, @types/node $types_major"
          test "$node_major" = "$types_major"

      - name: Baseline du projet généré
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm lint:ci
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # Le test de focus doit détecter un défaut, pas seulement laisser passer un projet sain (#5) :
      # sans le bloc claude-kit de globals.css, les liens n'ont plus que le contour par défaut
      # recoloré par shadcn à 50 % (1,96:1, sous le 3:1 de WCAG 1.4.11).
      - name: Le test de focus détecte l'anneau absent
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          cp src/app/globals.css "$RUNNER_TEMP/globals.css"
          sed -i '/>>> claude-kit/,/<<< claude-kit/d' src/app/globals.css
          if grep -q ':focus-visible' src/app/globals.css; then echo "Bloc non retiré"; exit 1; fi
          pnpm build
          if pnpm exec playwright test -g "focus stop" --retries=0 --reporter=line > "$RUNNER_TEMP/focus.log" 2>&1; then
            cat "$RUNNER_TEMP/focus.log"
            echo "Le test de focus passe alors que l'anneau global est retiré"
            exit 1
          fi
          grep -q "focus indicators under 3:1" "$RUNNER_TEMP/focus.log" || { cat "$RUNNER_TEMP/focus.log"; exit 1; }
          cp "$RUNNER_TEMP/globals.css" src/app/globals.css

      - name: Sync idempotent
        working-directory: ${{ runner.temp }}/canary
        run: |
          node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock --no-install \
            | sed -n '/claude-kit report/,$p' | tail -n +2 > report.json
          node -e 'const r=require("./report.json"); if (r.written.length) { console.error("Sync non idempotent:", r.written); process.exit(1); }'

  # Montée de version (ADR 0008) : un projet généré avec la version précédente du kit (le plus haut
  # tag v* inférieur à la version de plugin.json) est synchronisé avec le code courant, passe la
  # baseline, puis un second sync n'écrit rien.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Tag précédent
        id: previous
        run: |
          current=$(node -p 'require("./.claude-plugin/plugin.json").version')
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            lowest=$(printf '%s\n%s\n' "${tag#v}" "$current" | sort -V | head -n 1)
            if [ "${tag#v}" != "$current" ] && [ "$lowest" = "${tag#v}" ]; then
              echo "Kit $current, projet généré avec $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Aucun tag inférieur à $current"
          exit 1

      - name: Scaffold avec le tag précédent (tous les modules)
        env:
          TAG: ${{ steps.previous.outputs.tag }}
        run: |
          git config --global user.name "claude-kit canary"
          git config --global user.email "canary@users.noreply.github.com"
          git config --global init.defaultBranch main
          git worktree add --detach "$RUNNER_TEMP/kit-previous" "$TAG"
          node "$RUNNER_TEMP/kit-previous/scripts/apply.mjs" create "$RUNNER_TEMP/upgrade" --modules all \
            --var owner=TwelveLab12 --var boardNumber=1

      - name: Sync avec la version courante
        working-directory: ${{ runner.temp }}/upgrade
        run: node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock

      - name: Baseline du projet synchronisé
        working-directory: ${{ runner.temp }}/upgrade
        env:
          CI: "true"
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm lint:ci
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Second sync idempotent
        working-directory: ${{ runner.temp }}/upgrade
        run: |
          node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock --no-install \
            | sed -n '/claude-kit report/,$p' | tail -n +2 > report.json
          node -e 'const r=require("./report.json"); if (r.written.length) { console.error("Sync non idempotent:", r.written); process.exit(1); }'
