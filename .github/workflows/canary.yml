# Canary : génère chaque semaine un projet neuf avec TOUS les modules sur les dernières versions
# (create-next-app@latest, outils @latest), puis lance la chaîne complète. Si un standard de
# l'écosystème bouge (majeure, option dépréciée, défaut de CLI qui change…), on le sait avant de
# scaffolder un vrai projet. Un second job synchronise un projet généré avec la version précédente
# du kit (montée de version). Tourne aussi sur chaque PR du kit. Un échec planifié est relancé une
# fois, puis signalé par une issue : voir canary-retry.yml.
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  canary:
    runs-on: ubuntu-latest
    # Un run vert prend 2 minutes : sans délai maximum, une étape bloquée (miroirs apt de
    # `playwright install --with-deps`) tourne 360 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Syntaxe des scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Scaffold (tous les modules)
        run: |
          git config --global user.name "claude-kit canary"
          git config --global user.email "canary@users.noreply.github.com"
          git config --global init.defaultBranch main
          node scripts/apply.mjs create "$RUNNER_TEMP/canary" --modules all \
            --var owner=TwelveLab12 --var boardNumber=1

      - name: "@types/node à la majeure de Node (.nvmrc)"
        working-directory: ${{ runner.temp }}/canary
        run: |
          node_major=$(grep -oE '[0-9]+' .nvmrc | head -1)
          types_major=$(node -p "require('./package.json').devDependencies['@types/node'].match(/\\d+/)[0]")
          echo "Node $node_major, @types/node $types_major"
          test "$node_major" = "$types_major"

      # Baseline avant la PR (.claude/kit/core.md) : test:e2e:ci fait le build et les e2e.
      - name: Baseline du projet généré
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm lint:ci
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:ci

      # Le test de focus doit détecter un défaut, pas seulement laisser passer un projet sain (#5) :
      # sans le bloc claude-kit de globals.css, les liens n'ont plus que le contour par défaut
      # recoloré par shadcn à 50 % (1,96:1, sous le 3:1 de WCAG 1.4.11).
      - name: Le test de focus détecte l'anneau absent
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          cp src/app/globals.css "$RUNNER_TEMP/globals.css"
          sed -i '/>>> claude-kit/,/<<< claude-kit/d' src/app/globals.css
          if grep -q ':focus-visible' src/app/globals.css; then echo "Bloc non retiré"; exit 1; fi
          pnpm build
          if pnpm exec playwright test -g "focus stop" --retries=0 --reporter=line > "$RUNNER_TEMP/focus.log" 2>&1; then
            cat "$RUNNER_TEMP/focus.log"
            echo "Le test de focus passe alors que l'anneau global est retiré"
            exit 1
          fi
          grep -q "focus indicators under 3:1" "$RUNNER_TEMP/focus.log" || { cat "$RUNNER_TEMP/focus.log"; exit 1; }
          cp "$RUNNER_TEMP/globals.css" src/app/globals.css

      # L'indicateur d'un élément arrondi se lit sur la partie droite de ses côtés (#51) : le bouton
      # shadcn d'origine passe avec des coins de 12 px ou en pilule, le même bouton à l'indicateur
      # trop pâle échoue. Lues dans l'arrondi, les lignes de lecture donnaient 0 px à un bouton
      # conforme.
      - name: Le test de focus lit les éléments arrondis
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          cp e2e/routes.ts "$RUNNER_TEMP/routes.ts"
          mkdir -p src/app/canary-rounded
          cat > src/app/canary-rounded/page.tsx <<'EOF'
          import { Button } from "@/components/ui/button";

          export default function Page() {
            return (
              <main className="flex gap-4 p-8">
                <h1>Arrondis</h1>
                <Button variant="ghost" size="icon-lg" className="rounded-[12px]" aria-label="Arrondi net">
                  A
                </Button>
                <Button
                  variant="ghost"
                  size="icon-lg"
                  className="rounded-[12px] focus-visible:border-ring/40"
                  aria-label="Arrondi pâle"
                >
                  A
                </Button>
                <Button className="rounded-full">Pilule nette</Button>
                <Button className="rounded-full focus-visible:border-ring/40">Pilule pâle</Button>
              </main>
            );
          }
          EOF
          sed -i 's|\["/"\]|["/", "/canary-rounded"]|' e2e/routes.ts
          grep -q '"/canary-rounded"' e2e/routes.ts || { echo "Route non ajoutée"; exit 1; }
          pnpm build
          if pnpm exec playwright test -g "canary-rounded.*focus stop" --retries=0 --reporter=line > "$RUNNER_TEMP/rounded.log" 2>&1; then
            cat "$RUNNER_TEMP/rounded.log"
            echo "Le test de focus accepte un indicateur trop pâle sur un élément arrondi"
            exit 1
          fi
          if grep -qE "Arrondi net|Pilule nette" "$RUNNER_TEMP/rounded.log"; then
            cat "$RUNNER_TEMP/rounded.log"
            echo "Le test de focus rejette un élément arrondi conforme (#51)"
            exit 1
          fi
          grep -q "Arrondi pâle" "$RUNNER_TEMP/rounded.log" && grep -q "Pilule pâle" "$RUNNER_TEMP/rounded.log" \
            || { cat "$RUNNER_TEMP/rounded.log"; exit 1; }
          rm -r src/app/canary-rounded
          cp "$RUNNER_TEMP/routes.ts" e2e/routes.ts

      # `next dev` écrit dans .next/dev/types des types qui restent après l'arrêt du serveur et
      # peuvent être faux : route supprimée depuis (vercel/next.js#96620), imports inutilisés que
      # noUnusedLocals refuse depuis Next 16.4 (vercel/next.js#99919). Le tsconfig du module core
      # les exclut (#48) : typecheck et build doivent passer après un `next dev` puis la suppression
      # d'une route.
      - name: Typecheck et build après next dev
        working-directory: ${{ runner.temp }}/canary
        run: |
          mkdir -p src/app/canary-stale
          printf 'export default function Page() {\n  return <p>stale</p>;\n}\n' > src/app/canary-stale/page.tsx
          setsid pnpm dev --port 3100 > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev=$!
          served=
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/canary-stale; then served=1; break; fi
            sleep 1
          done
          kill -- -"$dev" 2>/dev/null || true
          wait "$dev" 2>/dev/null || true
          if [ -z "$served" ]; then cat "$RUNNER_TEMP/dev.log"; echo "next dev n'a pas servi /canary-stale"; exit 1; fi
          if ! grep -q canary-stale .next/dev/types/validator.ts; then
            echo "Le validateur de dev ne mentionne pas la route : le scénario ne teste plus rien, à revoir (#48)."
            exit 1
          fi
          rm -r src/app/canary-stale
          pnpm typecheck
          pnpm build

      # Le contrôle doit détecter le défaut : sans l'exclusion, les types de dev périmés de l'étape
      # précédente font échouer typecheck.
      - name: Sans l'exclusion, typecheck échoue sur les types de dev
        working-directory: ${{ runner.temp }}/canary
        run: |
          cp tsconfig.json "$RUNNER_TEMP/tsconfig.json"
          sed -i 's|, ".next/dev/types"\]|]|' tsconfig.json
          if grep -q '".next/dev/types"' tsconfig.json; then echo "Exclusion non retirée"; exit 1; fi
          if pnpm typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            cat "$RUNNER_TEMP/typecheck.log"
            echo "typecheck passe sans l'exclusion : Next ne laisse plus de types de dev périmés visibles par tsc."
            echo "Réévaluer l'exclusion de .next/dev/types dans le tsconfig du module core (#48, vercel/next.js#96620 et #99919)."
            exit 1
          fi
          grep -q '^\.next/dev/types/.*error TS' "$RUNNER_TEMP/typecheck.log" || { cat "$RUNNER_TEMP/typecheck.log"; exit 1; }
          cp "$RUNNER_TEMP/tsconfig.json" tsconfig.json

      # L'exclusion ne doit pas faire perdre la vérification des pages : une page invalide fait
      # échouer typecheck sur .next/types/validator.ts, que `next typegen` régénère.
      - name: Le typecheck détecte une page invalide
        working-directory: ${{ runner.temp }}/canary
        run: |
          mkdir -p src/app/canary-invalid
          printf 'export default 42;\n' > src/app/canary-invalid/page.tsx
          if pnpm typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            cat "$RUNNER_TEMP/typecheck.log"
            echo "typecheck accepte une page invalide : Next ne vérifie plus les pages dans .next/types."
            echo "Réévaluer l'exclusion de .next/dev/types dans le tsconfig du module core (#48)."
            exit 1
          fi
          grep -q '^\.next/types/validator\.ts.*error TS2344' "$RUNNER_TEMP/typecheck.log" || { cat "$RUNNER_TEMP/typecheck.log"; exit 1; }
          rm -r src/app/canary-invalid

      - name: Sync idempotent
        working-directory: ${{ runner.temp }}/canary
        run: |
          node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock --no-install \
            | sed -n '/claude-kit report/,$p' | tail -n +2 > report.json
          node -e 'const r=require("./report.json"); if (r.written.length) { console.error("Sync non idempotent:", r.written); process.exit(1); }'

  # Montée de version (ADR 0008) : un projet généré avec la version précédente du kit (le plus haut
  # tag v* inférieur à la version de plugin.json) est synchronisé avec le code courant, passe la
  # baseline, puis un second sync n'écrit rien. Généré en mode a11yGate=advisory, l'autre variante
  # du ci.yml, que le premier job ne couvre pas (#77).
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Tag précédent
        id: previous
        run: |
          current=$(node -p 'require("./.claude-plugin/plugin.json").version')
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            lowest=$(printf '%s\n%s\n' "${tag#v}" "$current" | sort -V | head -n 1)
            if [ "${tag#v}" != "$current" ] && [ "$lowest" = "${tag#v}" ]; then
              echo "Kit $current, projet généré avec $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Aucun tag inférieur à $current"
          exit 1

      - name: Scaffold avec le tag précédent (tous les modules, a11yGate=advisory)
        env:
          TAG: ${{ steps.previous.outputs.tag }}
        run: |
          git config --global user.name "claude-kit canary"
          git config --global user.email "canary@users.noreply.github.com"
          git config --global init.defaultBranch main
          git worktree add --detach "$RUNNER_TEMP/kit-previous" "$TAG"
          node "$RUNNER_TEMP/kit-previous/scripts/apply.mjs" create "$RUNNER_TEMP/upgrade" --modules all \
            --var owner=TwelveLab12 --var boardNumber=1 --var a11yGate=advisory

      - name: Sync avec la version courante
        working-directory: ${{ runner.temp }}/upgrade
        run: node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock

      - name: Baseline du projet synchronisé
        working-directory: ${{ runner.temp }}/upgrade
        env:
          CI: "true"
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm lint:ci
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:ci

      - name: Second sync idempotent
        working-directory: ${{ runner.temp }}/upgrade
        run: |
          node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock --no-install \
            | sed -n '/claude-kit report/,$p' | tail -n +2 > report.json
          node -e 'const r=require("./report.json"); if (r.written.length) { console.error("Sync non idempotent:", r.written); process.exit(1); }'
