# Canary : génère chaque semaine un projet neuf avec TOUS les modules sur les dernières versions
# (create-next-app@latest, outils @latest), puis lance la chaîne complète. Si un standard de
# l'écosystème bouge (majeure, option dépréciée, défaut de CLI qui change…), on le sait avant de
# scaffolder un vrai projet. Tourne aussi sur chaque PR du kit. Un échec planifié est relancé une
# fois, puis signalé par une issue : voir canary-retry.yml.
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  canary:
    runs-on: ubuntu-latest
    # Un run vert prend 2 minutes : sans délai maximum, une étape bloquée (miroirs apt de
    # `playwright install --with-deps`) tourne 360 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Syntaxe des scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Scaffold (tous les modules)
        run: |
          git config --global user.name "claude-kit canary"
          git config --global user.email "canary@users.noreply.github.com"
          git config --global init.defaultBranch main
          node scripts/apply.mjs create "$RUNNER_TEMP/canary" --modules all \
            --var owner=TwelveLab12 --var boardNumber=1

      - name: "@types/node à la majeure de Node (.nvmrc)"
        working-directory: ${{ runner.temp }}/canary
        run: |
          node_major=$(grep -oE '[0-9]+' .nvmrc | head -1)
          types_major=$(node -p "require('./package.json').devDependencies['@types/node'].match(/\\d+/)[0]")
          echo "Node $node_major, @types/node $types_major"
          test "$node_major" = "$types_major"

      - name: Baseline du projet généré
        working-directory: ${{ runner.temp }}/canary
        env:
          CI: "true"
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm lint:ci
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Sync idempotent
        working-directory: ${{ runner.temp }}/canary
        run: |
          node "$GITHUB_WORKSPACE/scripts/apply.mjs" apply . --from-lock --no-install \
            | sed -n '/claude-kit report/,$p' | tail -n +2 > report.json
          node -e 'const r=require("./report.json"); if (r.written.length) { console.error("Sync non idempotent:", r.written); process.exit(1); }'
