# Tests rapides du kit (node:test, sans réseau ni dépendance, faux `gh`). Le canary, lui, vérifie
# le projet généré sur les dernières versions de l'écosystème.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: node --test "test/*.test.mjs"
